# Kept out of the root workspace on purpose (Tauri pulls a large Windows-only dependency tree).
[workspace]

[package]
name = "eddy-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
